syntax = "proto3";
package unity_tool;

message UnityObjComponent {
    int32 gui_id = 1;
    string local_id = 2;
    string class_id = 3;
}

message UnityObjGameObject {
    string local_id = 2;
    string class_id = 3;
    string name = 5;
    string tag = 6;
    int32 layer = 7;
    bool isActive = 8;
    repeated UnityObjComponent components = 9;
}

message SceneResult {
    repeated UnityObjGameObject objects = 1;
    int32 total_count = 2;
}